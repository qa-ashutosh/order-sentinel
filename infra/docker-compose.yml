# order-sentinel — Local Infrastructure
#
# Runs the full supporting infrastructure for local development and
# manual integration testing. For automated test runs, Testcontainers
# manages its own containers — this compose is for human-driven testing
# and running a real OMS service against the test suite.
#
# Usage:
#   npm run infra:up     # Start all services
#   npm run infra:down   # Stop and remove volumes
#   npm run infra:logs   # Tail all logs

version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: order-sentinel-postgres
    environment:
      POSTGRES_DB: order_sentinel_test
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d order_sentinel_test"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── NATS ─────────────────────────────────────────────────────────────────────
  nats:
    image: nats:2.10-alpine
    container_name: order-sentinel-nats
    command: ["-js", "-m", "8222"]  # JetStream + monitoring
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring endpoint
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── NATS Monitoring UI (optional, great for debugging) ─────────────────────
  nats-surveyor:
    image: natsio/nats-surveyor:latest
    container_name: order-sentinel-nats-ui
    environment:
      NATS_SURVEYOR_SERVERS: "nats://nats:4222"
      NATS_SURVEYOR_COUNT: "1"
    ports:
      - "7777:7777"
    depends_on:
      nats:
        condition: service_healthy
    profiles:
      - monitoring  # Only starts with: docker compose --profile monitoring up

volumes:
  postgres_data:
    driver: local
