# ─────────────────────────────────────────────────────────────────────────────
# order-sentinel — CI Pipeline
#
# Production-grade CI for a prop trading QA framework.
# Runs on every push and PR.
#
# Pipeline stages:
#   1. Lint & Type-check  — catch issues before tests run
#   2. Contract tests     — schema validation (fast, no infra)
#   3. Trading logic tests — business rule validation (no infra)
#   4. API tests          — REST endpoint tests (Testcontainers)
#   5. Integration tests  — NATS + DB flow tests (Testcontainers)
#   6. Coverage report    — enforce coverage thresholds
#
# Testcontainers handles infra — no docker-compose setup needed in CI.
# ─────────────────────────────────────────────────────────────────────────────

name: order-sentinel CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Testcontainers config
  TESTCONTAINERS_RYUK_DISABLED: "false"
  DOCKER_HOST: unix:///var/run/docker.sock

jobs:

  # ── Stage 1: Static Analysis ─────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  # ── Stage 2: Contract Tests (no infra, runs fast) ────────────────────────────
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run contract tests
        run: npm run test:contracts

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-test-results
          path: test-results/

  # ── Stage 3: Trading Logic Tests (no infra) ───────────────────────────────────
  trading-logic-tests:
    name: Trading Logic Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run trading logic tests
        run: npm run test:trading

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trading-logic-test-results
          path: test-results/

  # ── Stage 4: API Tests (Testcontainers — real Postgres + NATS) ──────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [contract-tests, trading-logic-tests]

    # Testcontainers needs Docker — ubuntu-latest has it pre-installed
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Docker is available
        run: docker info

      - name: Run API tests
        run: npm run test:api
        env:
          API_BASE_URL: http://localhost:3000
          BROKER_TYPE: nats

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-results
          path: test-results/

  # ── Stage 5: Integration Tests (NATS message flow + DB state) ────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [contract-tests, trading-logic-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Docker is available
        run: docker info

      - name: Run integration tests
        run: npm run test:integration
        env:
          BROKER_TYPE: nats
          TESTCONTAINERS_RYUK_DISABLED: "false"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: test-results/

  # ── Stage 6: Coverage Report ──────────────────────────────────────────────────
  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [api-tests, integration-tests]
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite with coverage
        run: npm run test:coverage
        env:
          BROKER_TYPE: nats

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Coverage summary comment on PR
        uses: davelosert/vitest-coverage-report-action@v2
        if: github.event_name == 'pull_request'
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  # ── Final: All checks must pass ───────────────────────────────────────────────
  all-checks:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, contract-tests, trading-logic-tests, api-tests, integration-tests, coverage]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
          echo "All checks passed ✓"
